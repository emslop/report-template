name: Initialize PNG example
on:
  push:
    branches: [main]
    paths:
      - 'presentation/images/example-system.png.b64'
      - 'presentation/tools/restore_example.py'
      - '.github/workflows/initialize-example.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore-png:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore PNG only (no LaTeX, no PDF)
        run: python3 presentation/tools/restore_example.py
      - name: Commit PNG
        shell: bash
        run: |
          git add presentation/images/example-system.png
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add PNG example without building PDF'
          git push origin HEAD:main
